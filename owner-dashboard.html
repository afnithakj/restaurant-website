<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard - DineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h1>DineHub</h1>

            <p class="owner-label">Restaurant Owner</p>

            <nav>

                <a href="owner-dashboard.html" class="active">
                    Dashboard
                </a>

                <a href="my-restaurant.html">
                    My Restaurant
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="orders.html">
                    Orders
                </a>

                <a href="reservations.html">
                    Reservations
                </a>

                <a href="owner-profile.html">
                    Profile
                </a>

            </nav>

            <a href="login.html" class="logout">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="dashboard-header">

                <div>
                    <h2>Welcome Back!</h2>
                    <p>Manage your restaurant from here.</p>
                </div>

                <div class="owner-info">
                    <span>👤</span>
                    <span>Restaurant Owner</span>
                </div>

            </header>


            <!-- Statistics -->
            <section class="stats">

                <div class="stat-card">
                    <h3>Orders</h3>
                    <p>12</p>
                </div>

                <div class="stat-card">
                    <h3>Menu Items</h3>
                    <p>25</p>
                </div>

                <div class="stat-card">
                    <h3>Reservations</h3>
                    <p>5</p>
                </div>

                <div class="stat-card">
                    <h3>Customers</h3>
                    <p>48</p>
                </div>

            </section>

        </main>

    </div>

</body>

</html>
