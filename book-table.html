<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Table - DineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h1>DineHub</h1>

            <p class="owner-label">Customer</p>

            <nav>

                <a href="customer-home.html">
                    Home
                </a>

                <a href="restaurants.html" class="active">
                    Restaurants
                </a>

                <a href="customer-orders.html">
                    My Orders
                </a>

                <a href="my-reservations.html">
                    My Reservations
                </a>

                <a href="customer-profile.html">
                    Profile
                </a>

            </nav>

            <a href="login.html" class="logout">
                Logout
            </a>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <header class="dashboard-header">

                <div>

                    <h2>Book a Table</h2>

                    <p>
                        Make a reservation at the restaurant.
                    </p>

                </div>

            </header>


            <!-- Booking Form -->

            <section class="form-card">

                <form>


                    <label for="restaurant">
                        Restaurant
                    </label>

                    <input type="text"
                           id="restaurant"
                           value="Spice Garden"
                           readonly>


                    <label for="name">
                        Your Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your name"
                           required>


                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter your phone number"
                           required>


                    <label for="date">
                        Date
                    </label>

                    <input type="date"
                           id="date"
                           name="date"
                           required>


                    <label for="time">
                        Time
                    </label>

                    <input type="time"
                           id="time"
                           name="time"
                           required>


                    <label for="guests">
                        Number of Guests
                    </label>

                    <input type="number"
                           id="guests"
                           name="guests"
                           min="1"
                           max="20"
                           placeholder="Number of people"
                           required>


                    <label for="requests">
                        Special Requests
                    </label>

                    <textarea id="requests"
                              name="requests"
                              rows="4"
                              placeholder="Any special requests?"></textarea>


                    <div class="form-buttons">

                        <a href="restaurant-menu.html"
                           class="cancel-button">
                            Cancel
                        </a>

                        <button type="submit">
                            BOOK TABLE
                        </button>

                    </div>


                </form>

            </section>

        </main>

    </div>

</body>

</html>
