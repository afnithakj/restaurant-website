<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>DineHub</h1>

            <p class="tagline">Your Restaurant, Your Choice</p>

            <h2>Create Account</h2>

            <p class="account-question">
                How would you like to use DineHub?
            </p>

            <div class="account-options">

                <a href="customer-register.html" class="account-option">
                    <h3>Customer</h3>
                    <p>
                        Discover restaurants, explore menus,
                        order food and reserve tables.
                    </p>
                </a>

                <a href="owner-register.html" class="account-option">
                    <h3>Restaurant Owner</h3>
                    <p>
                        Create your restaurant, manage your menu,
                        orders and reservations.
                    </p>
                </a>

            </div>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
