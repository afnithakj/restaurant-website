<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - DineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h1>DineHub</h1>

            <p class="owner-label">Customer</p>

            <nav>

                <a href="customer-home.html">
                    Home
                </a>

                <a href="restaurants.html" class="active">
                    Restaurants
                </a>

                <a href="customer-orders.html">
                    My Orders
                </a>

                <a href="my-reservations.html">
                    My Reservations
                </a>

                <a href="customer-profile.html">
                    Profile
                </a>

            </nav>

            <a href="login.html" class="logout">
                Logout
            </a>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <header class="dashboard-header">

                <div>

                    <h2>Place an Order</h2>

                    <p>
                        Enter your order details.
                    </p>

                </div>

            </header>


            <!-- Order Form -->

            <section class="form-card">

                <form>


                    <label for="restaurant">
                        Restaurant
                    </label>

                    <input type="text"
                           id="restaurant"
                           value="Spice Garden"
                           readonly>


                    <label for="food">
                        Select Food
                    </label>

                    <select id="food" name="food" required>

                        <option value="">
                            Select a food item
                        </option>

                        <option value="chicken-biriyani">
                            Chicken Biriyani - ₹250
                        </option>

                        <option value="paneer-tikka">
                            Paneer Tikka - ₹180
                        </option>

                        <option value="chicken-65">
                            Chicken 65 - ₹150
                        </option>

                    </select>


                    <label for="quantity">
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="1"
                           value="1"
                           required>


                    <label for="customer-name">
                        Customer Name
                    </label>

                    <input type="text"
                           id="customer-name"
                           name="customer-name"
                           placeholder="Enter your name"
                           required>


                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter your phone number"
                           required>


                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea id="address"
                              name="address"
                              rows="4"
                              placeholder="Enter your delivery address"
                              required></textarea>


                    <label for="instructions">
                        Special Instructions
                    </label>

                    <textarea id="instructions"
                              name="instructions"
                              rows="3"
                              placeholder="Any special instructions?"></textarea>


                    <div class="form-buttons">

                        <a href="restaurant-menu.html"
                           class="cancel-button">
                            Back to Menu
                        </a>

                        <button type="submit">
                            PLACE ORDER
                        </button>

                    </div>


                </form>

            </section>

        </main>

    </div>

</body>

</html>
